# Render Blueprint for Sus. Deploy with: Render dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are prompted for in the dashboard on first deploy.
services:
  - type: web
    name: sus
    runtime: node
    # Session state is in memory: keep a single instance. The free plan sleeps when idle
    # (live sessions are lost on spin-down); use starter for demos.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID_RECRUITER
        sync: false
      - key: ELEVENLABS_AGENT_ID_BARTENDER
        sync: false
      - key: ELEVENLABS_AGENT_ID_NETWORKING
        sync: false
      - key: ELEVENLABS_AGENT_ID_CUSTOM
        sync: false
      - key: JUDGE_MODEL
        value: claude-haiku-5-5
      - key: GAP_MODEL
        value: claude-haiku-5-5
      - key: SUMMARY_MODEL
        value: claude-opus-5-5
      - key: AGENTBOXD_API_KEY
        sync: false
      - key: AGENTBOXD_HANDLER_CLIENT_ID
        value: sus-handler
